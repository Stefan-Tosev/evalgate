name: eval

on:
  push:
  pull_request:

jobs:
  # The unit tests and the mock-provider run need no key and no network, so
  # they gate every push including from forks.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Eval suite (mock provider)
        run: python -m evalgate cases/ --provider mock --seed 0 --no-baseline

  # The real run costs money and needs a secret, so it is scoped to pull
  # requests on the upstream repo. It writes a markdown report and gates on
  # movement against the committed baseline.
  model:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic

      - name: Eval suite (live model)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m evalgate cases/ \
            --provider anthropic \
            --samples 5 \
            --tolerance 0.2 \
            --markdown eval-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.md
